<div
  class="tw-flex tw-flex-col tw-gap-6 tw-h-full tw-min-h-0"
  *transloco="let t; prefix: 'leaves.leavesManagement.page'"
>
  <section id="header-section" class="tw-flex tw-flex-col tw-gap-2">
    <h1 class="tw-text-2xl tw-font-bold">{{ t('title') }}</h1>
    <div class="tw-text-sm">{{ t('description') }}</div>
  </section>

  <div id="leaves-toolbar" class="tw-flex tw-justify-between tw-mb-6">
    <div class="tw-flex tw-flex-col tw-gap-0">
      <div class="tw-flex tw-gap-6">
        <div class="tw-text-xl tw-font-semibold">{{ t('leaves') }}</div>
        <!-- REFRESH BUTTON -->
        <button class="tw-self-start" (click)="reload()">
          <i class="fa fa-refresh tw-text-primary tw-text-xl" aria-hidden="true"></i>
        </button>
      </div>
      <span class="tw-text-xs tw-font-bold tw-text-primary">
        @if (status() === 'resolved') {
          {{ t('leavesCreated', { count: leaves().countLeaveTypeOu }) }}
        }
      </span>
    </div>

    <div class="tw-flex tw-gap-4">
      <span
        [matTooltip]="isCreateLeaveDisabled() ? t('createLeaveDisabledTooltip') : ''"
        [matTooltipDisabled]="!isCreateLeaveDisabled()"
      >
        <button
          mat-flat-button
          color="primary"
          class="tw-h-full tw-px-6 tw-py-3 tw-rounded-md"
          [disabled]="isCreateLeaveDisabled()"
          (click)="onCreateClick()"
        >
          <i class="fa fa-plus" aria-hidden="true"></i>
          <span class="tw-ml-2 tw-font-semibold">{{ t('createLeave') }}</span>
        </button>
      </span>
    </div>
  </div>
  @if (status() === 'loading' || status() === 'reloading') {
    <div class="tw-flex tw-justify-center tw-items-center tw-flex-1">
      <mat-spinner></mat-spinner>
    </div>
  } @else if (status() === 'resolved' && leaves().countLeaveTypeOu > 0) {
    <section id="leaves-section" class="tw-flex-1 tw-min-h-0 tw-mb-4">
      <hl-leave-type-table
        [data]="leaves().leaveTypeOuSummaries"
        (addGroupRequested)="onAddGroupClick($event)"
      ></hl-leave-type-table>
    </section>
  } @else {
    <hl-empty-state
      [message]="t('emptyState.message')"
      [description]="t('emptyState.description')"
      iconName="calendar"
    />
  }
</div>
