<ng-container *transloco="let t; prefix: 'leaves.leavesManagement.table'">
  <div class="hl-table">
    <table mat-table [dataSource]="dataSource()">
      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>{{ t('header.type') }}</th>
        <td mat-cell *matCellDef="let element">{{ element.leaveTypeKey | transloco }}</td>
      </ng-container>

      <!-- Assignament Column -->
      <ng-container matColumnDef="assignment">
        <th mat-header-cell *matHeaderCellDef>{{ t('header.assignment') }}</th>
        <td mat-cell *matCellDef="let element">{{ element.assignment }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="hl-actions-cell"></th>
        <td mat-cell *matCellDef="let element" class="hl-actions-cell">
          <button
            mat-icon-button
            color="primary"
            class="hl-action-btn"
            [matMenuTriggerFor]="rowMenu"
            [matMenuTriggerData]="{ element }"
          >
            <i class="fa fa-ellipsis-v" aria-hidden="true"></i>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-menu #rowMenu="matMenu">
      <ng-template matMenuContent let-element="element">
        <button mat-menu-item (click)="onAddGroupClick(element)">
          <i class="fa-regular fa-circle-plus tw-text-primary tw-mr-4" aria-hidden="true"></i>
          <span>{{ t('actions.addGroup') }}</span>
        </button>

        <button mat-menu-item (click)="viewDetail(element)">
          <i class="fa fa-eye tw-text-primary tw-mr-4" aria-hidden="true"></i>
          <span>{{ t('actions.viewDetail') }}</span>
        </button>
      </ng-template>
    </mat-menu>

    @if (dataSource().data.length > 10) {
      <mat-paginator [pageSizeOptions]="[10, 20, 50]"></mat-paginator>
    }
  </div>
</ng-container>
